<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>OpenHarmony 助手 · HTML 对话预览</title>
  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #1e293b 0, #020617 50%, #000 100%);
      color: #e5e7eb;
    }

    /* 整个页面铺满屏幕的容器 */
    .chat-wrapper {
      width: 100%;
      height: 100vh;
      padding: 0;
      display: flex;
    }

    .chat-card {
      background: rgba(15, 23, 42, 0.92);
      border-radius: 0; /* 改为顶到底的全屏布局 */
      border-top: 1px solid rgba(148, 163, 184, 0.3);
      border-left: none;
      border-right: none;
      border-bottom: none;
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      backdrop-filter: blur(18px);
    }

    .chat-header {
      padding: 12px 18px;
      border-bottom: 1px solid rgba(30, 64, 175, 0.6);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(to right, rgba(15, 118, 110, 0.35), rgba(37, 99, 235, 0.35));
    }
    .chat-header-title {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .chat-header-orb {
      width: 24px;
      height: 24px;
      border-radius: 999px;
      background: conic-gradient(from 0deg, #22d3ee, #818cf8, #f97316, #22d3ee);
      position: relative;
      animation: spin 6s linear infinite;
    }
    .chat-header-orb::after {
      content: "";
      position: absolute;
      inset: 3px;
      border-radius: inherit;
      background: radial-gradient(circle at 30% 30%, #f9fafb, #312e81);
    }
    .chat-header h1 {
      font-size: 15px;
      margin: 0;
    }
    .chat-header span {
      font-size: 11px;
      color: #cbd5f5;
      opacity: 0.8;
    }

    /* 上部：对话区（滚动） */
    .chat-body {
      flex: 1;
      padding: 12px 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .bubble-row {
      display: flex;
      margin-bottom: 4px;
      width: 100%;
    }
    .bubble-row.user {
      justify-content: flex-end;
    }
    .bubble-row.assistant {
      justify-content: flex-start;
    }

    .bubble {
      width: 100%; /* 关键：助手气泡占满行，方便展示大 HTML */
      padding: 8px 10px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.5;
      word-wrap: break-word;
      white-space: pre-wrap;
    }
    .bubble.user-bubble {
      width: auto;
      max-width: 70%;
      background: linear-gradient(to right, #0ea5e9, #22c55e);
      color: #0b1120;
      border-bottom-right-radius: 4px;
      align-self: flex-end;
    }
    .bubble.assistant-bubble {
      background: rgba(15, 23, 42, 0.98);
      border: 1px solid rgba(148, 163, 184, 0.4);
      border-bottom-left-radius: 4px;
    }

    /* 助手 HTML 页面预览 iframe */
    .assistant-html-iframe {
      width: 100%;
      min-height: 500px;  /* 可以按需调整默认高度 */
      border: none;
      border-radius: 16px;
      background: #ffffff;
      overflow: auto;
    }
    @media (min-height: 900px) {
      .assistant-html-iframe {
        min-height: 700px;
      }
    }

    /* 下部：输入区 */
    .chat-footer {
      border-top: 1px solid rgba(51, 65, 85, 0.95);
      padding: 8px 14px 10px;
      background: rgba(15, 23, 42, 0.98);
    }
    .chat-footer form {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .chat-footer-top {
      display: flex;
      gap: 8px;
    }
    .chat-input {
      flex: 4;
      border-radius: 12px;
      border: 1px solid rgba(75, 85, 99, 0.9);
      background: rgba(15, 23, 42, 0.9);
      padding: 6px 8px;
      color: #e5e7eb;
      font-size: 14px;
      resize: none;
      min-height: 40px;
      max-height: 80px;
    }
    .chat-input:focus {
      outline: none;
      border-color: #38bdf8;
      box-shadow: 0 0 0 1px rgba(56, 189, 248, 0.4);
    }
    .chat-context {
      flex: 3;
      border-radius: 12px;
      border: 1px dashed rgba(55, 65, 81, 0.9);
      background: rgba(15, 23, 42, 0.7);
      padding: 6px 8px;
      color: #9ca3af;
      font-size: 12px;
      resize: none;
      min-height: 40px;
      max-height: 80px;
    }
    .chat-footer-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .hint {
      font-size: 11px;
      color: #9ca3af;
      opacity: 0.8;
    }
    .send-button {
      padding: 6px 18px;
      border-radius: 999px;
      border: none;
      font-size: 13px;
      font-weight: 500;
      color: #0b1120;
      background: linear-gradient(to right, #22d3ee, #818cf8);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 8px 24px rgba(56, 189, 248, 0.3);
      transition: transform 0.08s ease, box-shadow 0.08s ease, opacity 0.1s ease;
    }
    .send-button:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 32px rgba(59, 130, 246, 0.4);
    }
    .send-button:active {
      transform: translateY(0);
      box-shadow: 0 6px 20px rgba(59, 130, 246, 0.3);
    }
    .send-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* “思考中”动画 */
    .thinking-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .thinking-avatar {
      width: 22px;
      height: 22px;
      border-radius: 999px;
      background: conic-gradient(#22d3ee, #818cf8, #f97316, #22d3ee);
      position: relative;
      animation: breathe 1.8s ease-in-out infinite;
    }
    .thinking-avatar::after {
      content: "";
      position: absolute;
      inset: 3px;
      border-radius: inherit;
      background: radial-gradient(circle at 30% 30%, #e5e7eb, #111827);
    }
    .thinking-dots {
      display: flex;
      align-items: flex-end;
      gap: 4px;
    }
    .thinking-dot {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: linear-gradient(to bottom right, #38bdf8, #a855f7);
      opacity: 0.4;
      animation: thinking-bounce 1.1s infinite;
    }
    .thinking-dot:nth-child(2) {
      animation-delay: 0.16s;
    }
    .thinking-dot:nth-child(3) {
      animation-delay: 0.32s;
    }
    @keyframes thinking-bounce {
      0%, 80%, 100% {
        transform: translateY(0);
        opacity: 0.4;
      }
      40% {
        transform: translateY(-4px);
        opacity: 1;
      }
    }
    @keyframes breathe {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.2);
      }
      50% {
        transform: scale(1.05);
        box-shadow: 0 0 0 10px rgba(56, 189, 248, 0);
      }
    }
    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .chat-body::-webkit-scrollbar {
      width: 6px;
    }
    .chat-body::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.4);
      border-radius: 999px;
    }
  </style>
</head>
<body>
  <div class="chat-wrapper">
    <div class="chat-card">
      <div class="chat-header">
        <div class="chat-header-title">
          <div class="chat-header-orb"></div>
          <div>
            <h1>OpenHarmony 助手 · 实时 HTML 对话</h1>
            <span>LLM 返回的是完整 HTML 页面，这里直接嵌入预览 👀</span>
          </div>
        </div>
      </div>

      <div class="chat-body" id="chatBody">
        <div class="bubble-row assistant">
          <div class="bubble assistant-bubble">
            你好，我是 OpenHarmony 文档助手。<br/>
            每次回答我都会生成一份完整 HTML 页面，并在下方直接预览。
          </div>
        </div>
      </div>

      <div class="chat-footer">
        <form id="chatForm">
          <div class="chat-footer-top">
            <textarea
              id="queryInput"
              class="chat-input"
              placeholder="输入你的问题，例如：请介绍 OpenHarmony 的技术架构。"
            ></textarea>
            <textarea
              id="contextInput"
              class="chat-context"
              placeholder="可选：填 RAG 检索到的上下文"
            ></textarea>
          </div>
          <div class="chat-footer-bottom">
            <div class="hint">回车发送，Shift + 回车换行。</div>
            <button type="submit" class="send-button" id="sendBtn">
              <span>发送</span><span>➤</span>
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script>
    // 与后端同域的话可以用相对路径；如果是单独 html 文件，改成 http://localhost:8000/chat
    const API_URL = "/chat";

    const chatBody = document.getElementById("chatBody");
    const chatForm = document.getElementById("chatForm");
    const queryInput = document.getElementById("queryInput");
    const contextInput = document.getElementById("contextInput");
    const sendBtn = document.getElementById("sendBtn");

    let isWaiting = false;
    let thinkingBubbleEl = null;

    function appendUserMessage(text) {
      const row = document.createElement("div");
      row.className = "bubble-row user";

      const bubble = document.createElement("div");
      bubble.className = "bubble user-bubble";
      bubble.textContent = text;

      row.appendChild(bubble);
      chatBody.appendChild(row);
      chatBody.scrollTop = chatBody.scrollHeight;
    }

    function appendThinkingBubble() {
      const row = document.createElement("div");
      row.className = "bubble-row assistant";

      const bubble = document.createElement("div");
      bubble.className = "bubble assistant-bubble";

      const container = document.createElement("div");
      container.className = "thinking-container";

      const avatar = document.createElement("div");
      avatar.className = "thinking-avatar";

      const dots = document.createElement("div");
      dots.className = "thinking-dots";
      for (let i = 0; i < 3; i++) {
        const dot = document.createElement("div");
        dot.className = "thinking-dot";
        dots.appendChild(dot);
      }

      container.appendChild(avatar);
      container.appendChild(dots);
      bubble.appendChild(container);
      row.appendChild(bubble);

      chatBody.appendChild(row);
      chatBody.scrollTop = chatBody.scrollHeight;

      thinkingBubbleEl = bubble;
    }

    // ✅ 关键：把 LLM 返回的 HTML 用 iframe 渲染出来
    function replaceThinkingWithAnswer(html) {
      if (!thinkingBubbleEl) return;

      const iframe = document.createElement("iframe");
      iframe.className = "assistant-html-iframe";
      // 关键：防止外链图片站点（如 gitee）基于 Referer 做防盗链，导致 iframe 内图片 403
      // 让 iframe 内的资源请求不携带 Referer
      iframe.referrerPolicy = "no-referrer";
      iframe.setAttribute("referrerpolicy", "no-referrer");
      iframe.srcdoc = html;
      // 如果你想稍微限制一下 iframe 权限，可以打开 sandbox：
      // iframe.setAttribute("sandbox", "allow-same-origin allow-scripts allow-forms allow-popups");

      thinkingBubbleEl.innerHTML = "";
      thinkingBubbleEl.appendChild(iframe);

      chatBody.scrollTop = chatBody.scrollHeight;
      thinkingBubbleEl = null;
    }

    async function sendMessage(query, ragContext) {
      if (!query.trim() || isWaiting) return;

      isWaiting = true;
      sendBtn.disabled = true;

      appendUserMessage(query);
      appendThinkingBubble();

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            query: query,
            rag_context: ragContext || "",
          }),
        });

        if (!res.ok) {
          throw new Error("HTTP " + res.status);
        }

        const data = await res.json();
        replaceThinkingWithAnswer(data.html || "<p>（空响应）</p>");
      } catch (err) {
        console.error(err);
        replaceThinkingWithAnswer("<p>抱歉，我这边出了一点错误，请稍后再试。</p>");
      } finally {
        isWaiting = false;
        sendBtn.disabled = false;
      }
    }

    chatForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const query = queryInput.value.trim();
      const ctx = contextInput.value.trim();
      if (!query) return;

      sendMessage(query, ctx);
      queryInput.value = "";
    });

    queryInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        chatForm.requestSubmit();
      }
    });
  </script>
</body>
</html>
